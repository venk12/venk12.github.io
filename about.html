<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nebula Notes — About</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50" hx-target="#page" hx-swap="innerHTML">
  <div hx-get="blocks.html" hx-select="#block-header" hx-trigger="load"></div>

  <main id="page" class="min-h-[60vh] max-w-5xl mx-auto px-6 py-10 grid md:grid-cols-3 gap-6">
    <div class="md:col-span-2 grid gap-6">
      <div hx-get="blocks.html" hx-select="#block-about" hx-trigger="load"></div>
      <div hx-get="blocks.html" hx-select="#block-quote" hx-trigger="load"></div>
    </div>
    <aside class="grid gap-6">
      <div hx-get="blocks.html" hx-select="#block-sidebar" hx-trigger="load"></div>
      <div hx-get="blocks.html" hx-select="#block-gallery" hx-trigger="load"></div>
    </aside>
  </main>

  <div hx-get="blocks.html" hx-select="#block-footer" hx-trigger="load"></div>
</body>
</html>
