<html>
    <head>
        <meta charset="UTF-8">
        <title>My first web page</title>
        <script src="https://unpkg.com/htmx.org"></script>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 flex items-center justify-center h-screen">
        <div class="container mx-auto p-6 bg-white rounded-lg shadow-lg">
        <p class="text-3xl font-bold text-center text-gray-800 mb-6">hello world</p>
    <h1 class="text-2xl font-semibold text-gray-700 mb-4">Item List</h1>
    <ul id="item-list" class="list-disc list-inside mb-6 space-y-2">
        {% for item in items %}
        <li>{{ item }}</li>
        {% endfor %}
    </ul>
    <form hx-post="/add-item" hx-target="#item-list" hx-swap="beforeend" hx-include="#item-input" class="flex space-x-2">
        <input type="text" id="item-input" name="item" required class="flex-1 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">Add Item</button>
    </form>        
        </div>
    </body>
</html>
