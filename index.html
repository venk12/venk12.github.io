<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pages</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:24px;color:#111}
    h1{font-size:1.5rem;margin-bottom:0.5rem}
    ul{padding-left:1.2rem}
    li{margin:0.6rem 0}
    a{color:#0366d6;text-decoration:none}
    a:hover{text-decoration:underline}
    .note{color:#666;font-size:0.9rem}
    .back{display:inline-block;margin-bottom:1rem}
    .page{max-width:60ch}
    img{max-width:100%;height:auto}
    pre{background:#f6f8fa;padding:12px;border-radius:6px;overflow:auto}
  </style>
  <script>
    function escapeHtml(s){
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
    }
    function linkify(s){
      return s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
              .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }
    function inlineFormat(s){
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*(.*?)\*/g, '<em>$1</em>');
      return s;
    }
    function renderMarkdown(md){
      const lines = md.replace(/\r\n/g,'\n').split('\n');
      let html = '';
      let inList = false;
      for (let i=0;i<lines.length;i++){
        const line = lines[i];
        // code block
        if(/^```/.test(line)){
          let code = '';
          i++;
          while(i<lines.length && !/^```/.test(lines[i])){ code += lines[i++] + '\n'; }
          html += '<pre><code>'+escapeHtml(code.trim())+'</code></pre>';
          continue;
        }
        // blockquote
        if(/^>\s?/.test(line)){
          let quoteLines = [];
          while(i<lines.length && /^>\s?/.test(lines[i])){
            quoteLines.push(lines[i].replace(/^>\s?/,'').trim());
            i++;
          }
          i--; // step back one because outer for-loop will increment
          const quoteHtml = quoteLines.map(l => '<p>'+inlineFormat(linkify(escapeHtml(l)))+'</p>').join('');
          html += '<blockquote>'+quoteHtml+'</blockquote>';
          inList = false;
          continue;
        }
        // headings
        if(/^#{1,6}\s+/.test(line)){
          const level = line.match(/^#{1,6}/)[0].length;
          const text = line.replace(/^#{1,6}\s+/,'').trim();
          html += `<h${level}>${inlineFormat(linkify(escapeHtml(text)))}</h${level}>`;
          inList = false;
          continue;
        }
        // lists
        if(/^[-*+]\s+/.test(line)){
          if(!inList){ html += '<ul>'; inList = true; }
          const item = line.replace(/^[-*+]\s+/,'').trim();
          html += '<li>'+inlineFormat(linkify(escapeHtml(item)))+'</li>';
          continue;
        }
        // blank line
        if(line.trim()===''){ if(inList){ html += '</ul>'; inList=false;} html += '<p></p>'; continue; }
        // paragraph
        html += '<p>'+inlineFormat(linkify(escapeHtml(line.trim())))+'</p>';
      }
      if(inList) html += '</ul>';
      return html;
    }

    async function loadList(){
      const list = document.getElementById('list');
      list.textContent = 'Loading...';
      try{
        const res = await fetch('pages.json');
        if(!res.ok) throw new Error('Failed to load pages.json');
        const pages = await res.json();
        list.innerHTML = pages.map(p => {
          const parts = p.split('/');
          const filename = parts[parts.length-1] || p;
          const title = filename.replace(/\.md$/i,'').replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
          return `<li><a href="#" data-path="${p}">${title}</a></li>`;
        }).join('\n');
      }catch(e){
        list.textContent = 'Failed to load pages list.';
        console.error(e);
      }
    }

    async function showPage(path){
      const listView = document.getElementById('list-view');
      const pageView = document.getElementById('page-view');
      const pageTitle = document.getElementById('page-title');
      const pageContent = document.getElementById('page-content');
      const rawLink = document.getElementById('raw-link');

      listView.style.display = 'none';
      pageView.style.display = 'block';
      pageTitle.textContent = '';
      pageContent.innerHTML = 'Loading...';
      try{
        const res = await fetch(encodeURI(path));
        if(!res.ok) throw new Error('Failed to load '+path);
        const md = await res.text();
        // set title from the first heading if available
        const firstLine = md.split(/\r?\n/)[0]||'';
        const title = (firstLine.replace(/^#\s+/,'').trim()) || path.split('/').pop();
        pageTitle.textContent = title;
        pageContent.innerHTML = renderMarkdown(md);
        rawLink.href = encodeURI(path);
        history.pushState({path}, '', '#'+encodeURIComponent(path));
      }catch(e){
        pageContent.textContent = 'Failed to load page.';
        console.error(e);
      }
    }

    function goHome(){
      const listView = document.getElementById('list-view');
      const pageView = document.getElementById('page-view');
      pageView.style.display = 'none';
      listView.style.display = 'block';
      history.pushState({}, '', location.pathname);
    }

    document.addEventListener('click', (e)=>{
      const a = e.target.closest('a[data-path]');
      if(a){ e.preventDefault(); showPage(a.getAttribute('data-path')); }
      const back = e.target.closest('[data-back]');
      if(back){ e.preventDefault(); goHome(); }
    });

    window.addEventListener('DOMContentLoaded', async ()=>{
      await loadList();
      const hash = location.hash.startsWith('#') ? decodeURIComponent(location.hash.slice(1)) : '';
      if(hash) showPage(hash);
    });

    window.addEventListener('popstate', (e)=>{
      const path = (e.state && e.state.path) || '';
      if(path) showPage(path); else goHome();
    });
  </script>
</head>
<body>
  <div id="list-view">
    <h1>exploratium</h1>
    <ul id="list" aria-live="polite"></ul>
  </div>

  <div id="page-view" style="display:none">
    <div class="back"><a href="#" data-back>&larr; back to home</a></div>
    <h1 id="page-title"></h1>


    <div id="page-content" class="page-content"></div>
  </div>
</body>
</html>
